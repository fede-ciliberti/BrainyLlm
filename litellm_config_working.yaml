# Configuración general
router_settings:
  routing_strategy: "usage-based-routing-v2"

  allowed_fails: 1
  cooldown_time: 120 # Tiempo en segundos para enfriar claves agotadas
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 1 # Mantener bajo para enfriar rápidamente claves agotadas

  timeout: 120 # Aumentado de 30s a 2 minutos para llamadas no-streaming

  set_verbose: false
  enable_pre_call_checks: false

  redis_host: "redis" # Nombre del contenedor Redis en Docker
  redis_port: 6379
  redis_password: "" # Dejar vacío si no hay password
  callbacks: ["prometheus"]
  health_check_interval: 15
  fallbacks:
    - gemini-flash: [gemini-flash, gemini-pro]
    - gemini-pro: [gemini-pro, gemini-flash]

# Configuración de seguridad
security:
  enable_api_key_validation: false

# Configuración general
general_settings:
  master_key: "sk-1234567890"
  database_url: "os.environ/DATABASE_URL"
  background_health_checks: false
  health_check_interval: 21600
  store_prompts_in_spend_logs: false
  global_max_parallel_requests: 44

# Configuración de LiteLLM
litellm_settings:
  drop_params: true # Mantener
  json_logs: true
  request_timeout: 600 # Aumentado a 10 minutos para mayor estabilidad
  turn_off_message_logging: true
  # Configuración básica de cache con Redis
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: ""
    ttl: 600 # Tiempo de vida en segundos
  # Configuración de rate limiting básica
  num_retries: 50